<style>
/* Layout: an exam console — a fixed status strip (candidate, timer) over one question at a time, with a question navigator beside it. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202b; --muted:#5b6878; --line:#d8dee7;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ecf6;
  --code-bg:#eef2f7; --good:#1f7a4d; --good-soft:#e1f2e9; --bad:#b4372f; --bad-soft:#f8e3e1;
  --warn:#a86207; --warn-soft:#fbefd9; --flag:#7a4bb0;
  --f-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --fg:#e4e9f0; --muted:#97a3b3; --line:#2a3442;
  --accent:#6fa3d6; --accent-ink:#0c1520; --accent-soft:#1d2d40;
  --code-bg:#1d2632; --good:#5cc08b; --good-soft:#163024; --bad:#ec7a70; --bad-soft:#3a1d1b;
  --warn:#e2a64a; --warn-soft:#352711; --flag:#b48ce6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --fg:#e4e9f0; --muted:#97a3b3; --line:#2a3442;
  --accent:#6fa3d6; --accent-ink:#0c1520; --accent-soft:#1d2d40;
  --code-bg:#1d2632; --good:#5cc08b; --good-soft:#163024; --bad:#ec7a70; --bad-soft:#3a1d1b;
  --warn:#e2a64a; --warn-soft:#352711; --flag:#b48ce6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:600}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
code,pre{font-family:var(--f-code);font-size:.86rem}
code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0;line-height:1.5;white-space:pre}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],textarea{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{font-family:var(--f-code);font-size:.85rem;min-height:140px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}

/* Start screen */
.start{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fact{border-top:2px solid var(--accent);padding-top:8px}
.fact b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--fg);font-weight:500}

/* Exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .inner{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.who{font-weight:600}
.timer{font-family:var(--f-code);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--accent-soft)}
.timer.low{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad)}
.progress{height:4px;background:var(--line)}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:start}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtext{font-size:1.08rem;font-weight:500;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .key{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .body{min-width:0;flex:1}
.opt .body pre{margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{position:sticky;top:84px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{padding:8px 0;font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:600}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.grid button.flag{box-shadow:inset 0 -3px 0 var(--flag)}
.legend{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.flagbtn.on{color:var(--flag);border-color:var(--flag)}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}

/* Done */
.codebox{font-family:var(--f-code);font-size:1rem;word-break:break-all;padding:14px;border-radius:10px;background:var(--code-bg);border:1px dashed var(--accent);user-select:all}
.score{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* Grader */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg);cursor:pointer}
td.c,th.c{text-align:center}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}.na{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.b{background:var(--bad-soft);color:var(--bad)}
.qstat{display:grid;grid-template-columns:40px minmax(0,1fr) 120px 48px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter.lo span{background:var(--bad)}
details.key{border-top:1px solid var(--line);padding:14px 0}
details.key summary{cursor:pointer;font-weight:600}
.explain{border-left:3px solid var(--good);padding:6px 12px;margin-top:10px;background:var(--good-soft);border-radius:0 8px 8px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.modal{position:fixed;inset:0;background:rgba(10,15,22,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{max-width:440px;width:100%}

@media (max-width:820px){
  .start,.exam{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;order:-1}
  .grid{grid-template-columns:repeat(8,1fr)}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .qstat{grid-template-columns:32px minmax(0,1fr) 70px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Part B and grader additions */
.parts{display:flex;flex-direction:column;gap:8px}
.parts>div{display:flex;flex-direction:column;border-left:3px solid var(--accent);padding-left:10px}
.pill{background:var(--accent-soft);color:var(--fg)}
textarea.sql{min-height:170px;font-size:.88rem;line-height:1.5;tab-size:2}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.ul{margin:6px 0 8px;padding-left:22px}
.grid button.wq{border-style:dashed;border-color:var(--warn)}
.grid button.wq.done{background:var(--accent-soft);border-color:var(--accent);border-style:solid}
details.expected summary{cursor:pointer}
details.expected[open] summary{margin-bottom:12px}
.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.sqlgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.sqlcard{margin-bottom:12px}
.ans{font-size:.88rem;font-variant-numeric:tabular-nums}
@media (max-width:820px){.sqlgrid{grid-template-columns:minmax(0,1fr)}}
</style>

<div id="app"></div>
<script>
(function(){
"use strict";
const TEST_ID = "SQL3";
const DURATION_MIN = 35;
const STORE_KEY = "sqlw2-attempt-v3";
const CFG_KEY = "sqlw2-grader-expected-v3";
const SALT = "olist-w2-v3-grain";

/* ---------- Questions ---------- */
const MCQ = [
 {
  "id": 1,
  "topic": "Query order",
  "day": "D1",
  "text": "In what order does PostgreSQL logically process these clauses?",
  "opts": [
   "SELECT → FROM → WHERE → GROUP BY → ORDER BY",
   "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT",
   "FROM → SELECT → WHERE → GROUP BY → HAVING → ORDER BY",
   "WHERE → FROM → GROUP BY → SELECT → HAVING → ORDER BY"
  ],
  "why": "You write SELECT first, but Postgres runs it fifth: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT."
 },
 {
  "id": 2,
  "topic": "Query order",
  "day": "D1",
  "text": "This query fails with <code>column \"total_paid\" does not exist</code>. Why?",
  "code": "SELECT order_id, price + freight_value AS total_paid\nFROM raw.order_items\nWHERE total_paid > 100;",
  "opts": [
   "You cannot add two columns in SELECT",
   "Aliases need double quotes in WHERE",
   "WHERE runs before SELECT, so the alias does not exist yet",
   "The table needs a LIMIT clause"
  ],
  "why": "The alias is created in SELECT, which runs after WHERE. Repeat the expression in WHERE (or use a CTE). The alias is allowed in ORDER BY because that runs after SELECT."
 },
 {
  "id": 3,
  "topic": "COUNT & DISTINCT",
  "day": "D1",
  "text": "<code>raw.customers</code> has 99,441 rows, and <code>COUNT(DISTINCT customer_unique_id)</code> returns 96,096. What does this query return?",
  "code": "SELECT DISTINCT COUNT(customer_unique_id)\nFROM raw.customers;",
  "opts": [
   "96,096",
   "99,441",
   "3,345",
   "An error: DISTINCT cannot be used with COUNT"
  ],
  "why": "COUNT runs first and counts every non-NULL value (99,441). DISTINCT then applies to the single result row, so it changes nothing. Put DISTINCT inside COUNT() to count unique people."
 },
 {
  "id": 4,
  "topic": "COUNT & DISTINCT",
  "day": "D1",
  "text": "Some orders are not delivered yet, so <code>order_delivered_customer_date</code> is NULL for them. Which expression counts <b>every row</b> in <code>raw.orders</code>, including those?",
  "opts": [
   "COUNT(order_delivered_customer_date)",
   "COUNT(DISTINCT order_status)",
   "COUNT(*)",
   "COUNT(DISTINCT order_delivered_customer_date)"
  ],
  "why": "COUNT(*) counts rows. COUNT(col) skips NULLs in that column, and COUNT(DISTINCT col) counts unique non-NULL values."
 },
 {
  "id": 5,
  "topic": "WHERE vs HAVING",
  "day": "D1",
  "text": "You need sellers who sold <b>more than 100 items</b>. Which query is correct?",
  "opts": [
   {
    "code": "SELECT seller_id, COUNT(*)\nFROM raw.order_items\nWHERE COUNT(*) > 100\nGROUP BY seller_id;"
   },
   {
    "code": "SELECT seller_id, COUNT(*)\nFROM raw.order_items\nGROUP BY seller_id\nHAVING COUNT(*) > 100;"
   },
   {
    "code": "SELECT seller_id, COUNT(*) AS items\nFROM raw.order_items\nWHERE items > 100;"
   },
   {
    "code": "SELECT seller_id, COUNT(*)\nFROM raw.order_items\nHAVING seller_id > 100;"
   }
  ],
  "why": "WHERE filters rows before grouping and cannot use aggregates. HAVING filters groups after GROUP BY, so it is where COUNT(*) > 100 belongs."
 },
 {
  "id": 6,
  "topic": "GROUP BY",
  "day": "D1",
  "text": "This query fails with <code>column \"customer_city\" must appear in the GROUP BY clause</code>. What is the correct fix?",
  "code": "SELECT customer_state, customer_city, COUNT(*)\nFROM raw.customers\nGROUP BY customer_state;",
  "opts": [
   "Add customer_city to GROUP BY, or remove it from SELECT",
   "Add DISTINCT after SELECT",
   "Move COUNT(*) into the WHERE clause",
   "Add ORDER BY customer_city"
  ],
  "why": "Every column in SELECT must be either in GROUP BY or inside an aggregate. Postgres can't pick one city for a whole state."
 },
 {
  "id": 7,
  "topic": "ORDER BY & LIMIT",
  "day": "D1",
  "text": "What does <code>SELECT * FROM raw.orders LIMIT 10;</code> return?",
  "opts": [
   "The 10 oldest orders",
   "The 10 most recent orders",
   "The first 10 rows by order_id",
   "Any 10 rows. Without ORDER BY, the order is not guaranteed"
  ],
  "why": "SQL tables have no built-in order. Use ORDER BY (plus a tie-breaker column) whenever the order matters."
 },
 {
  "id": 8,
  "topic": "Join syntax",
  "day": "D2",
  "text": "A join of <code>raw.orders</code> and <code>raw.order_items</code> fails with <code>column reference \"order_id\" is ambiguous</code>. What fixes it?",
  "opts": [
   "Prefix the column with its table alias, e.g. o.order_id",
   "Use LEFT JOIN instead of JOIN",
   "Wrap order_id in DISTINCT",
   "Rename the column in one of the tables"
  ],
  "why": "Both tables have order_id, so Postgres doesn't know which one you mean. Always alias tables and prefix every column."
 },
 {
  "id": 9,
  "topic": "Grain & keys",
  "day": "D2",
  "text": "What is the <b>grain</b> of <code>raw.orders</code>?",
  "opts": [
   "One row per item within an order",
   "One row per payment of an order",
   "One row per order",
   "One row per real customer (customer_unique_id)"
  ],
  "why": "Grain answers \"one row per what?\". In raw.orders, order_id is the primary key: one row per order, with its status and five timestamps (99,441 rows). Items live in order_items and payments in order_payments, which is why joining them to orders multiplies rows."
 },
 {
  "id": 10,
  "topic": "Row multiplication",
  "day": "D2",
  "text": "<code>raw.orders</code> has 99,441 rows. <code>orders LEFT JOIN order_reviews ON order_id</code> returns <b>more</b> than 99,441 rows. Why?",
  "opts": [
   "LEFT JOIN also adds reviews that have no order",
   "LEFT JOIN behaves like a CROSS JOIN",
   "NULL review scores are counted twice",
   "Some orders have more than one review, so those orders repeat"
  ],
  "why": "An order with several reviews matches several right-side rows and produces one output row per match (1-to-many). LEFT JOIN never returns fewer rows than the left table, but it can return more."
 },
 {
  "id": 11,
  "topic": "Join types",
  "day": "D2",
  "text": "Which query correctly counts orders that have <b>no review at all</b>?",
  "opts": [
   {
    "code": "SELECT COUNT(*)\nFROM raw.orders o\nJOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE r.order_id IS NULL;"
   },
   {
    "code": "SELECT COUNT(*)\nFROM raw.orders o\nLEFT JOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE r.order_id IS NULL;"
   },
   {
    "code": "SELECT COUNT(*)\nFROM raw.orders o\nLEFT JOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE o.order_id IS NULL;"
   },
   {
    "code": "SELECT COUNT(*)\nFROM raw.order_reviews r\nWHERE r.review_score IS NULL;"
   }
  ],
  "why": "The anti-join pattern: LEFT JOIN, then keep the rows where the right-side key IS NULL. An INNER JOIN has already removed those rows, and o.order_id is never NULL."
 },
 {
  "id": 12,
  "topic": "LEFT JOIN trap",
  "day": "D2",
  "text": "What does this query actually return?",
  "code": "SELECT o.order_id, r.review_score\nFROM raw.orders o\nLEFT JOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE r.review_score = 5;",
  "opts": [
   "Only orders with a 5-star review. The WHERE turns it into an INNER JOIN",
   "All orders, with score 5 or NULL",
   "All orders, because LEFT JOIN keeps every left row",
   "An error: you cannot filter the right table of a LEFT JOIN"
  ],
  "why": "Orders with no review have a NULL score, and WHERE removes them. To keep every order, move the condition into ON: ON r.order_id = o.order_id AND r.review_score = 5."
 },
 {
  "id": 13,
  "topic": "Row multiplication",
  "day": "D2",
  "text": "An order has <b>3 items</b> and <b>1 payment</b> of 109.29. After joining order_items to order_payments on order_id, <code>SUM(payment_value)</code> shows 327.87. What is the right fix?",
  "opts": [
   "Use SUM(DISTINCT payment_value)",
   "Switch to LEFT JOIN",
   "Aggregate each table to one row per order_id first, then join",
   "Divide the result by COUNT(*)"
  ],
  "why": "The single payment row is copied onto every item row (3 × 109.29). Pre-aggregate both child tables to the same grain (order_id), then join. SUM(DISTINCT) breaks as soon as two real payments have the same value."
 }
];
const W = [
 {id:14, topic:"Write & run SQL", points:2,
  html:`Write a query that returns the <b>number of orders per customer state</b>, sorted with the most orders first. Run it on your <code>olist_dw</code> database.`,
  fields:[{k:"state",label:"Which state is ranked #1?",ph:"e.g. RJ",kind:"text"},{k:"orders",label:"How many orders does it have?",ph:"e.g. 12345",kind:"num"}],
  model:"SELECT c.customer_state,\n       COUNT(o.order_id) AS orders\nFROM raw.orders AS o\nJOIN raw.customers AS c\n  ON c.customer_id = o.customer_id\nGROUP BY c.customer_state\nORDER BY orders DESC;",
  why:"Join orders to customers on customer_id, group by state, count orders, sort DESC. COUNT(*) or COUNT(DISTINCT o.order_id) give the same result here because customer_id is one row per order. Common mistakes: COUNT(DISTINCT customer_unique_id) counts people (too low); joining payments or items with COUNT(*) causes fan-out (too high)."},
 {id:15, topic:"Write & run SQL", points:3,
  html:`For each <b>product category</b> (<code>product_category_name</code>), show:<ul class="ul"><li>the number of items sold</li><li>the number of different sellers who sold items in that category</li></ul>Sort the categories by items sold, highest first. Run your query on <code>olist_dw</code>, then enter:`,
  fields:[{k:"cat",label:"The #1 category",ph:"category name",kind:"text"},{k:"items",label:"Its items sold",ph:"number",kind:"num"},{k:"sellers",label:"Its number of different sellers",ph:"number",kind:"num"}],
  model:"SELECT p.product_category_name,\n       COUNT(*)                     AS items_sold,\n       COUNT(DISTINCT oi.seller_id) AS sellers\nFROM raw.order_items AS oi\nJOIN raw.products AS p\n  ON p.product_id = oi.product_id\nGROUP BY p.product_category_name\nORDER BY items_sold DESC;",
  why:"order_items is one row per item, so COUNT(*) counts items sold. Sellers repeat across items, so they need COUNT(DISTINCT oi.seller_id); plain COUNT(seller_id) equals items sold (fan-out). The full result also has a NULL category row: products with no category are grouped together."}
];
const DEFAULT_EXPECTED = {state:"SP", orders:"41746", cat:"cama_mesa_banho", items:"11115", sellers:""};

const PASS = 14;

/* ---------- Helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = sec=>{sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")};
function load(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function clearStore(){try{localStorage.removeItem(STORE_KEY)}catch(e){}}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36).padStart(6,"0").slice(-6)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bytesToB64(b){let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,"_").replace(/\//g,".").replace(/=+$/,"")}
function b64ToBytes(s){s=s.replace(/_/g,"+").replace(/\./g,"/");while(s.length%4)s+="=";const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
async function pipe(bytes,stream){const r=new Response(new Blob([bytes]).stream().pipeThrough(stream));return new Uint8Array(await r.arrayBuffer())}
async function pack(str){
  const raw=new TextEncoder().encode(str);
  try{if(typeof CompressionStream!=="undefined"){const z=await pipe(raw,new CompressionStream("deflate-raw"));if(z.length<raw.length)return "z"+bytesToB64(z)}}catch(e){}
  return "p"+bytesToB64(raw);
}
async function unpack(s){
  const kind=s[0],b=b64ToBytes(s.slice(1));
  if(kind==="z")return new TextDecoder().decode(await pipe(b,new DecompressionStream("deflate-raw")));
  return new TextDecoder().decode(b);
}
const squash = sql=>String(sql||"").replace(/--[^\n]*/g,"").replace(/\s+/g," ").trim();
const normNum = v=>String(v==null?"":v).replace(/[\s,]/g,"").replace(/\.0+$/,"");
const normTxt = v=>String(v==null?"":v).trim().toLowerCase().replace(/\s+/g,"_");

/* ---------- Result code ---------- */
async function makeCode(st){
  const ans=MCQ.map(q=>st.answers[q.id]==null?"-":"abcd"[st.answers[q.id]]).join("");
  const used=Math.round(Math.min(DURATION_MIN*60,(st.submittedAt-st.startedAt)/1000));
  const w=st.written||{};
  const arr=[st.name,ans,used,st.leaves||0,st.submittedAt,st.auto?1:0,
    (w.state||"").trim(),(w.orders||"").trim(),(w.cat||"").trim(),(w.items||"").trim(),(w.sellers||"").trim(),
    squash(w.sql14).slice(0,900),squash(w.sql15).slice(0,900)];
  const payload=JSON.stringify(arr);
  return TEST_ID+"-"+(await pack(payload))+"-"+hash(SALT+payload);
}
async function parseCode(code){
  const m=/^SQL3-([zp][A-Za-z0-9_.]+)-([0-9a-z]{6})$/.exec(code.trim());
  if(!m)return null;
  let payload;try{payload=await unpack(m[1])}catch(e){return null}
  let a;try{a=JSON.parse(payload)}catch(e){return null}
  if(!Array.isArray(a)||a.length<13)return null;
  const answers={};MCQ.forEach((q,i)=>{const c=a[1][i];answers[q.id]=(c&&c!=="-")?"abcd".indexOf(c):null});
  return {name:String(a[0]),answers,used:+a[2],leaves:+a[3],at:+a[4],auto:a[5]===1,
    w:{state:a[6],orders:a[7],cat:a[8],items:a[9],sellers:a[10],sql14:a[11],sql15:a[12]},
    valid:hash(SALT+payload)===m[2],code:code.trim()};
}
function mcqScore(answers){return MCQ.reduce((n,q)=>n+(answers[q.id]===KEY[q.id]?1:0),0)}
function writtenMarks(w,exp){
  const chk=(k,kind)=>{const e=exp[k];if(e==null||String(e).trim()==="")return null;return kind==="num"?normNum(w[k])===normNum(e):normTxt(w[k])===normTxt(e)};
  return {state:chk("state","text"),orders:chk("orders","num"),cat:chk("cat","text"),items:chk("items","num"),sellers:chk("sellers","num")};
}

/* ---------- State ---------- */
let S = load(STORE_KEY) || {phase:"start"};
let timerId=null;
const app=$("#app");
const save=()=>store(STORE_KEY,S);

function render(){
  clearInterval(timerId);
  if(location.hash==="#grader"){renderGrader();return}
  if(location.hash==="#reset"){clearStore();S={phase:"start"};history.replaceState(null,"",location.pathname+location.search)}
  if(S.phase==="exam")renderExam();
  else if(S.phase==="done")renderDone();
  else renderStart();
}

/* ---------- Exam ---------- */
const findQ=id=>MCQ.find(q=>q.id===id)||W.find(w=>w.id===id);
const isW=id=>W.some(w=>w.id===id);
function isDone(id){
  if(!isW(id))return S.answers[id]!=null;
  const w=W.find(x=>x.id===id),v=S.written||{};
  return !!(v["sql"+id]||"").trim() && w.fields.every(f=>(v[f.k]||"").trim());
}
function remaining(){return DURATION_MIN*60-(Date.now()-S.startedAt)/1000}
function renderExam(){
  if(remaining()<=0){submit(true);return}
  const qid=S.order[S.cur], q=findQ(qid), written=isW(qid);
  const done=S.order.filter(isDone).length;

        ${q.opts.map((o,i)=>`<label class="opt ${S.answers[qid]===i?"sel":""}">

          <span class="key">${L[i]}</span>
          <span class="body">${typeof o==="string"?esc(o):`<pre>${esc(o.code)}</pre>`}</span></label>`).join("")}
      </div>`;
  }else{
    const v=S.written||{};
    body=`<div class="qtext">${q.html}</div>
      <div class="stack" style="gap:6px">
        <label class="eyebrow" for="sql${qid}">1. Paste your query</label>
        <textarea id="sql${qid}" class="sql" spellcheck="false" maxlength="1200" placeholder="SELECT ...">${esc(v["sql"+qid]||"")}</textarea>
      </div>
      <div class="fields">
        ${q.fields.map((f,i)=>`<div class="stack" style="gap:6px"><label class="eyebrow" for="f_${f.k}">${i+2}. ${esc(f.label)}</label>
          <input type="text" id="f_${f.k}" data-k="${f.k}" ${f.kind==="num"?'inputmode="numeric"':""} placeholder="${esc(f.ph)}" value="${esc(v[f.k]||"")}" autocomplete="off"></div>`).join("")}
      </div>
      <p class="muted" style="margin:0;font-size:.85rem">Type the numbers exactly as your query returns them. Your answers save as you type.</p>`;
  }
  app.innerHTML=`
  <div class="bar"><div class="inner">
    <div><div class="eyebrow">Candidate</div><div class="who">${esc(S.name)}</div></div>
    <div class="row"><span class="muted" id="cnt" style="font-variant-numeric:tabular-nums">${done}/${S.order.length} answered</span><div class="timer" id="timer" role="timer" aria-live="off">${fmt(remaining())}</div></div>
  </div><div class="progress"><span id="prog" style="width:${done/S.order.length*100}%"></span></div></div>
  <div class="wrap">
    ${S.leaves?`<div class="notice" style="margin-bottom:16px">You left this tab ${S.leaves} time${S.leaves>1?"s":""} during Part A. This is included in your result.</div>`:""}
    <div class="exam">
      <div class="card stack">
        <div class="qhead"><span class="eyebrow">Question ${S.cur+1} of ${S.order.length} · ${q.topic}${written?` · ${q.points} points`:""}</span>
          <div class="row" style="gap:8px">${partB}<button class="ghost flagbtn ${S.flags[qid]?"on":""}" id="flag" aria-pressed="${!!S.flags[qid]}">${S.flags[qid]?"Flagged":"Flag for review"}</button></div></div>
        ${body}
        <div class="row" style="justify-content:space-between">
          <button id="prev" ${S.cur===0?"disabled":""}>Previous</button>
          ${S.cur<S.order.length-1?`<button class="primary" id="next">Next</button>`:`<button class="primary" id="finish">Review &amp; submit</button>`}

      </div>
      <aside class="card stack nav" aria-label="Question navigator">
        <span class="eyebrow">Questions</span>
        <div class="grid">${S.order.map((id,i)=>`<button data-i="${i}" class="${isDone(id)?"done":""} ${i===S.cur?"cur":""} ${S.flags[id]?"flag":""} ${isW(id)?"wq":""}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
        <div class="legend"><span><i class="sw" style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i class="sw" style="box-shadow:inset 0 -3px 0 var(--flag)"></i>Flagged</span><span><i class="sw" style="border-style:dashed;border-color:var(--warn)"></i>Write &amp; run SQL</span></div>
        <button id="finish2">Submit test</button>
      </aside>
    </div>
  </div>`;
  app.querySelectorAll(".opt input").forEach(r=>r.addEventListener("change",()=>{S.answers[qid]=+r.value;save();renderExam()}));
  if(written){
    const upd=()=>{save();const d=S.order.filter(isDone).length;$("#cnt").textContent=`${d}/${S.order.length} answered`;$("#prog").style.width=(d/S.order.length*100)+"%";
      app.querySelectorAll(".grid button").forEach(b=>b.classList.toggle("done",isDone(S.order[+b.dataset.i])))};

  }

  $("#prev").onclick=()=>{S.cur--;save();renderExam()};
  const n=$("#next");if(n)n.onclick=()=>{S.cur++;save();renderExam()};
  const f=$("#finish");if(f)f.onclick=confirmSubmit;
  $("#finish2").onclick=confirmSubmit;
  app.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.i;save();renderExam()});
  tick();timerId=setInterval(tick,1000);
}
function tick(){
  const r=remaining(),t=$("#timer");
  if(r<=0){submit(true);return}
  if(t){t.textContent=fmt(r);t.className="timer"+(r<=60?" crit":r<=300?" low":"")}
}
function confirmSubmit(){
  const blank=S.order.filter(id=>!isDone(id)).length;
  const flagged=Object.values(S.flags).filter(Boolean).length;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card stack" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">Submit your test?</h2>
    <p style="margin:0">${blank?`<b>${blank}</b> question${blank>1?"s are":" is"} not complete. `:"All questions are answered. "}${flagged?`${flagged} flagged for review. `:""}You can't change answers after submitting.</p>
    <div class="row" style="justify-content:flex-end"><button id="mc">Keep working</button><button class="primary" id="ms">Submit</button></div></div>`;
  document.body.appendChild(m);
  $("#mc",m).onclick=()=>m.remove();
  $("#ms",m).onclick=()=>{m.remove();submit(false)};
  $("#ms",m).focus();
}
async function submit(auto){
  if(S.phase!=="exam")return;
  clearInterval(timerId);
  S.phase="done";S.auto=auto;S.submittedAt=Math.min(Date.now(),S.startedAt+DURATION_MIN*60000);
  S.code=await makeCode(S);save();
  render();
}
document.addEventListener("visibilitychange",()=>{
  if(S.phase!=="exam")return;
  const onPartA=!isW(S.order[S.cur]);
  if(document.hidden&&onPartA){S.leaves=(S.leaves||0)+1;save()}
  else if(!document.hidden)renderExam();
});

/* ---------- Done ---------- */
function renderDone(){
  if(!S.code){makeCode(S).then(c=>{S.code=c;save();renderDone()});return}
  const sc=mcqScore(S.answers);
  app.innerHTML=`
  <div class="wrap stack" style="max-width:680px">
    <div class="eyebrow">Test submitted${S.auto?" · time ran out":""}</div>

}

/* ---------- Grader (instructor) ---------- */
let G={text:"",tab:"results",sort:"score",rows:[],exp:Object.assign({},DEFAULT_EXPECTED,load(CFG_KEY)||{}),focus:0};
async function decodeAll(){
  const codes=[...new Set((G.text.match(/SQL3-[zp][A-Za-z0-9_.]+-[0-9a-z]{6}/g)||[]))];
  const parsed=(await Promise.all(codes.map(parseCode))).filter(Boolean);
  const byName={};parsed.forEach(r=>{const k=r.name.toLowerCase();if(!byName[k]||r.at>byName[k].at)byName[k]=r});
  G.rows=Object.values(byName);
}
function scored(){
  return G.rows.map(r=>{const wm=writtenMarks(r.w,G.exp);const wpts=Object.values(wm).filter(v=>v===true).length;const m=mcqScore(r.answers);return {...r,wm,mcq:m,wpts,score:m+wpts}});
}

        <div class="stack" style="gap:6px;min-width:0"><span class="eyebrow">Q14 · orders per state</span><pre>${esc(r.w.sql14)||"<span class='na'>(no query)</span>"}</pre>
          <div class="ans">#1 state <b>${esc(r.w.state)||"–"}</b> ${mark(r.wm.state)} · orders <b>${esc(r.w.orders)||"–"}</b> ${mark(r.wm.orders)}</div></div>
        <div class="stack" style="gap:6px;min-width:0"><span class="eyebrow">Q15 · categories &amp; sellers</span><pre>${esc(r.w.sql15)||"<span class='na'>(no query)</span>"}</pre>
          <div class="ans">#1 <b>${esc(r.w.cat)||"–"}</b> ${mark(r.wm.cat)} · items <b>${esc(r.w.items)||"–"}</b> ${mark(r.wm.items)} · sellers <b>${esc(r.w.sellers)||"–"}</b> ${mark(r.wm.sellers)}</div></div>
      </div></div>`).join(""):`<div class="card muted">No result codes yet.</div>`;
    pane.querySelectorAll(".sqlcard pre").forEach(p=>{p.style.whiteSpace="pre-wrap";p.style.wordBreak="break-word"});
  }else if(G.tab==="questions"){
    const stats=[...MCQ.map(q=>({id:q.id,label:q.topic,txt:q.text.replace(/<[^>]+>/g,""),pct:rows.length?rows.filter(r=>r.answers[q.id]===KEY[q.id]).length/rows.length:0})),
      {id:14,label:"Write & run SQL",txt:"Orders per customer state (both values correct)",pct:rows.length?rows.filter(r=>r.wm.state&&r.wm.orders).length/rows.length:0},
      {id:15,label:"Write & run SQL",txt:"Categories: items and sellers (all three correct)",pct:rows.length?rows.filter(r=>r.wm.cat&&r.wm.items&&r.wm.sellers).length/rows.length:0}];
    pane.innerHTML=`<div class="card">${stats.map(s=>`<div class="qstat"><b>Q${s.id}</b><span style="min-width:0">${s.label}<span class="muted"> · ${esc(s.txt.slice(0,70))}${s.txt.length>70?"…":""}</span></span><div class="meter ${s.pct<.5?"lo":""}"><span style="width:${s.pct*100}%"></span></div><span style="text-align:right">${rows.length?Math.round(s.pct*100)+"%":"–"}</span></div>`).join("")}
    <p class="muted" style="margin:10px 0 0;font-size:.85rem">Questions under 50% (red) are the ones to go through first in the debrief.</p></div>`;
  }else{
    pane.innerHTML=`<div class="card">${MCQ.map(q=>`<details class="key"><summary>Q${q.id} · ${q.topic} · Answer ${L[KEY[q.id]]}</summary>
      <div class="stack" style="margin-top:10px"><div class="qtext">${q.text}</div>${q.code?`<pre>${esc(q.code)}</pre>`:""}
      <div class="opts">${q.opts.map((o,i)=>`<div class="opt ${i===KEY[q.id]?"sel":""}" style="cursor:default"><span class="key">${L[i]}</span><span class="body">${typeof o==="string"?esc(o):`<pre>${esc(o.code)}</pre>`}</span></div>`).join("")}</div>
      <div class="explain">${q.why}</div></div></details>`).join("")}
      ${W.map(w=>`<details class="key"><summary>Q${w.id} · Write &amp; run SQL · ${w.points} points</summary>
      <div class="stack" style="margin-top:10px"><div class="qtext">${w.html}</div><span class="eyebrow">Model answer</span><pre>${esc(w.model)}</pre>
      <div class="explain">${w.why}</div></div></details>`).join("")}</div>`;
  }
}
window.addEventListener("hashchange",render);

/* Instructor shortcut for the owner when opened as a Claude artifact */
(async()=>{
  try{
    const u=window.claude&&await window.claude.use("user");
    if(u&&u.isOwner&&await u.isOwner()&&location.hash!=="#grader"&&S.phase!=="exam"){
      const a=document.createElement("a");a.href="#grader";a.textContent="Open instructor results";
      a.style.cssText="position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none;z-index:9";
      document.body.appendChild(a);
      window.addEventListener("hashchange",()=>a.hidden=location.hash==="#grader"||S.phase==="exam");
    }
  }catch(e){}
})();

render();
})();
</script>
