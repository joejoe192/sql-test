<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>SQL Screening Test · Week 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: an exam console — a fixed status strip (candidate, timer) over one question at a time, with a question navigator beside it. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --fg:#17202b; --muted:#5b6878; --line:#d8dee7;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ecf6;
  --code-bg:#eef2f7; --good:#1f7a4d; --good-soft:#e1f2e9; --bad:#b4372f; --bad-soft:#f8e3e1;
  --warn:#a86207; --warn-soft:#fbefd9; --flag:#7a4bb0;
  --f-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --fg:#e4e9f0; --muted:#97a3b3; --line:#2a3442;
  --accent:#6fa3d6; --accent-ink:#0c1520; --accent-soft:#1d2d40;
  --code-bg:#1d2632; --good:#5cc08b; --good-soft:#163024; --bad:#ec7a70; --bad-soft:#3a1d1b;
  --warn:#e2a64a; --warn-soft:#352711; --flag:#b48ce6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --fg:#e4e9f0; --muted:#97a3b3; --line:#2a3442;
  --accent:#6fa3d6; --accent-ink:#0c1520; --accent-soft:#1d2d40;
  --code-bg:#1d2632; --good:#5cc08b; --good-soft:#163024; --bad:#ec7a70; --bad-soft:#3a1d1b;
  --warn:#e2a64a; --warn-soft:#352711; --flag:#b48ce6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
h1,h2,h3{text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:600}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
code,pre{font-family:var(--f-code);font-size:.86rem}
code{background:var(--code-bg);padding:.1em .35em;border-radius:4px}
pre{background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0;line-height:1.5;white-space:pre}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],textarea{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{font-family:var(--f-code);font-size:.85rem;min-height:140px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}

/* Start screen */
.start{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fact{border-top:2px solid var(--accent);padding-top:8px}
.fact b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--fg);font-weight:500}

/* Exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .inner{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.who{font-weight:600}
.timer{font-family:var(--f-code);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--accent-soft)}
.timer.low{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--bad-soft);color:var(--bad)}
.progress{height:4px;background:var(--line)}
.progress span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:start}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.qtext{font-size:1.08rem;font-weight:500;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .key{flex:none;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .body{min-width:0;flex:1}
.opt .body pre{margin-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{position:sticky;top:84px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grid button{padding:8px 0;font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:600}
.grid button.done{background:var(--accent-soft);border-color:var(--accent)}
.grid button.cur{outline:2px solid var(--fg);outline-offset:1px}
.grid button.flag{box-shadow:inset 0 -3px 0 var(--flag)}
.legend{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.flagbtn.on{color:var(--flag);border-color:var(--flag)}
.notice{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}

/* Done */
.codebox{font-family:var(--f-code);font-size:1rem;word-break:break-all;padding:14px;border-radius:10px;background:var(--code-bg);border:1px dashed var(--accent);user-select:all}
.score{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}

/* Grader */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--bg);cursor:pointer}
td.c,th.c{text-align:center}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}.na{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:600}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.b{background:var(--bad-soft);color:var(--bad)}
.qstat{display:grid;grid-template-columns:40px minmax(0,1fr) 120px 48px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.meter.lo span{background:var(--bad)}
details.key{border-top:1px solid var(--line);padding:14px 0}
details.key summary{cursor:pointer;font-weight:600}
.explain{border-left:3px solid var(--good);padding:6px 12px;margin-top:10px;background:var(--good-soft);border-radius:0 8px 8px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.modal{position:fixed;inset:0;background:rgba(10,15,22,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{max-width:440px;width:100%}

@media (max-width:820px){
  .start,.exam{grid-template-columns:minmax(0,1fr)}
  .nav{position:static;order:-1}
  .grid{grid-template-columns:repeat(8,1fr)}
  .facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .qstat{grid-template-columns:32px minmax(0,1fr) 70px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
"use strict";
const TEST_ID = "SQL2";
const DURATION_MIN = 25;
const STORE_KEY = "sqlw2-attempt-v1";

/* ---------- Questions (Week 2 · Day 1 + Day 2) ---------- */
const Q = [
 {id:1, topic:"Query order", day:"D1",
  text:"In what order does PostgreSQL logically process these clauses?",
  opts:["SELECT → FROM → WHERE → GROUP BY → ORDER BY","FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT","FROM → SELECT → WHERE → GROUP BY → HAVING → ORDER BY","WHERE → FROM → GROUP BY → SELECT → HAVING → ORDER BY"],
  why:"You write SELECT first, but Postgres runs it fifth: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT."},
 {id:2, topic:"Query order", day:"D1",
  text:"This query fails with <code>column \"total_paid\" does not exist</code>. Why?",
  code:"SELECT order_id, price + freight_value AS total_paid\nFROM raw.order_items\nWHERE total_paid > 100;",
  opts:["You cannot add two columns in SELECT","Aliases need double quotes in WHERE","WHERE runs before SELECT, so the alias does not exist yet","The table needs a LIMIT clause"],
  why:"The alias is created in SELECT, which runs after WHERE. Repeat the expression in WHERE (or use a CTE). The alias is allowed in ORDER BY because that runs after SELECT."},
 {id:3, topic:"COUNT & DISTINCT", day:"D1",
  text:"<code>raw.customers</code> has 99,441 rows, and <code>COUNT(DISTINCT customer_unique_id)</code> returns 96,096. What does this query return?",
  code:"SELECT DISTINCT COUNT(customer_unique_id)\nFROM raw.customers;",
  opts:["96,096","99,441","3,345","An error: DISTINCT cannot be used with COUNT"],
  why:"COUNT runs first and counts every non-NULL value (99,441). DISTINCT then applies to the single result row, so it changes nothing. Put DISTINCT inside COUNT() to count unique people."},
 {id:4, topic:"COUNT & DISTINCT", day:"D1",
  text:"Which expression counts <b>every row</b>, including rows where the column is NULL?",
  opts:["COUNT(order_delivered_customer_date)","COUNT(DISTINCT order_id)","COUNT(*)","SUM(1) FILTER (WHERE order_id IS NOT NULL)"],
  why:"COUNT(*) counts rows. COUNT(col) skips NULLs in that column, and COUNT(DISTINCT col) counts unique non-NULL values."},
 {id:5, topic:"WHERE vs HAVING", day:"D1",
  text:"You need sellers who sold <b>more than 100 items</b>. Which query is correct?",
  opts:[
   {code:"SELECT seller_id, COUNT(*)\nFROM raw.order_items\nWHERE COUNT(*) > 100\nGROUP BY seller_id;"},
   {code:"SELECT seller_id, COUNT(*)\nFROM raw.order_items\nGROUP BY seller_id\nHAVING COUNT(*) > 100;"},
   {code:"SELECT seller_id, COUNT(*) AS items\nFROM raw.order_items\nWHERE items > 100;"},
   {code:"SELECT seller_id, COUNT(*)\nFROM raw.order_items\nHAVING seller_id > 100;"}],
  why:"WHERE filters rows before grouping and cannot use aggregates. HAVING filters groups after GROUP BY, so it is where COUNT(*) > 100 belongs."},
 {id:6, topic:"GROUP BY", day:"D1",
  text:"This query fails with <code>column \"customer_city\" must appear in the GROUP BY clause</code>. What is the correct fix?",
  code:"SELECT customer_state, customer_city, COUNT(*)\nFROM raw.customers\nGROUP BY customer_state;",
  opts:["Add customer_city to GROUP BY, or remove it from SELECT","Add DISTINCT after SELECT","Move COUNT(*) into the WHERE clause","Add ORDER BY customer_city"],
  why:"Every column in SELECT must be either in GROUP BY or inside an aggregate. Postgres can't pick one city for a whole state."},
 {id:7, topic:"ORDER BY & LIMIT", day:"D1",
  text:"What does <code>SELECT * FROM raw.orders LIMIT 10;</code> return?",
  opts:["The 10 oldest orders","The 10 most recent orders","The first 10 rows by order_id","Any 10 rows. Without ORDER BY, the order is not guaranteed"],
  why:"SQL tables have no built-in order. Use ORDER BY (plus a tie-breaker column) whenever the order matters."},
 {id:8, topic:"Join syntax", day:"D2",
  text:"A join of <code>raw.orders</code> and <code>raw.order_items</code> fails with <code>column reference \"order_id\" is ambiguous</code>. What fixes it?",
  opts:["Prefix the column with its table alias, e.g. o.order_id","Use LEFT JOIN instead of JOIN","Wrap order_id in DISTINCT","Rename the column in one of the tables"],
  why:"Both tables have order_id, so Postgres doesn't know which one you mean. Always alias tables and prefix every column."},
 {id:9, topic:"Grain & keys", day:"D2",
  text:"What is the <b>grain</b> of <code>raw.order_items</code>?",
  opts:["One row per order","One row per product","One row per item within an order","One row per seller"],
  why:"Grain answers \"one row per what?\". An order with 3 items has 3 rows in order_items, so order_id is not unique there."},
 {id:10, topic:"Row multiplication", day:"D2",
  text:"<code>raw.orders</code> has 99,441 rows. <code>orders LEFT JOIN order_reviews ON order_id</code> returns <b>more</b> than 99,441 rows. Why?",
  opts:["LEFT JOIN also adds reviews that have no order","LEFT JOIN behaves like a CROSS JOIN","NULL review scores are counted twice","Some orders have more than one review, so those orders repeat"],
  why:"An order with several reviews matches several right-side rows and produces one output row per match (1-to-many). LEFT JOIN never returns fewer rows than the left table, but it can return more."},
 {id:11, topic:"Join types", day:"D2",
  text:"Which query correctly counts orders that have <b>no review at all</b>?",
  opts:[
   {code:"SELECT COUNT(*)\nFROM raw.orders o\nJOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE r.order_id IS NULL;"},
   {code:"SELECT COUNT(*)\nFROM raw.orders o\nLEFT JOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE r.order_id IS NULL;"},
   {code:"SELECT COUNT(*)\nFROM raw.orders o\nLEFT JOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE o.order_id IS NULL;"},
   {code:"SELECT COUNT(*)\nFROM raw.order_reviews r\nWHERE r.review_score IS NULL;"}],
  why:"The anti-join pattern: LEFT JOIN, then keep the rows where the right-side key IS NULL. An INNER JOIN has already removed those rows, and o.order_id is never NULL."},
 {id:12, topic:"LEFT JOIN trap", day:"D2",
  text:"What does this query actually return?",
  code:"SELECT o.order_id, r.review_score\nFROM raw.orders o\nLEFT JOIN raw.order_reviews r ON r.order_id = o.order_id\nWHERE r.review_score = 5;",
  opts:["Only orders with a 5-star review. The WHERE turns it into an INNER JOIN","All orders, with score 5 or NULL","All orders, because LEFT JOIN keeps every left row","An error: you cannot filter the right table of a LEFT JOIN"],
  why:"Orders with no review have a NULL score, and WHERE removes them. To keep every order, move the condition into ON: ON r.order_id = o.order_id AND r.review_score = 5."},
 {id:13, topic:"Row multiplication", day:"D2",
  text:"An order has <b>3 items</b> and <b>1 payment</b> of 109.29. After joining order_items to order_payments on order_id, <code>SUM(payment_value)</code> shows 327.87. What is the right fix?",
  opts:["Use SUM(DISTINCT payment_value)","Switch to LEFT JOIN","Aggregate each table to one row per order_id first, then join","Divide the result by COUNT(*)"],
  why:"The single payment row is copied onto every item row (3 × 109.29). Pre-aggregate both child tables to the same grain (order_id), then join. SUM(DISTINCT) breaks as soon as two real payments have the same value."},
 {id:14, topic:"Row multiplication", day:"D2",
  text:"A 3-table join runs forever and returns millions of rows. What is the <b>most likely</b> cause?",
  opts:["The tables are missing indexes","You used too many table aliases","LEFT JOIN is slower than INNER JOIN","A missing or wrong ON condition created an accidental CROSS JOIN"],
  why:"Without a correct ON, every row matches every row. Check every ON condition, and compare COUNT(*) before and after each join."},
 {id:15, topic:"Join types", day:"D2",
  text:"For \"top product categories in English\", why do we <b>LEFT JOIN</b> products to the category translation table instead of INNER JOIN?",
  opts:["LEFT JOIN is always faster","INNER JOIN would duplicate every category","Some products have no category, or a category with no translation. INNER JOIN would silently drop their items","The translation table has no primary key"],
  why:"INNER JOIN drops rows that have no match, so those items would vanish from the totals without any error. LEFT JOIN keeps them, with a NULL English name you can label or investigate."}
];
// Answer key, lightly encoded so it is not readable at a glance in the page source.
const K = atob("YmNiY2JhZGFjZGJhY2Rj").split("").map(c=>c.charCodeAt(0)-97);
const KEY = {}; Q.forEach((q,i)=>KEY[q.id]=K[i]);
const L = ["A","B","C","D"];

/* ---------- Helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = sec=>{sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")};
function load(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"null")}catch(e){return null}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S))}catch(e){}}
function clearStore(){try{localStorage.removeItem(STORE_KEY)}catch(e){}}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36).padStart(6,"0").slice(-6)}
const SALT="olist-w2-grain";
function b64e(str){const b=new TextEncoder().encode(str);let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"_").replace(/\//g,".").replace(/=+$/,"")}
function b64d(s){s=s.replace(/_/g,"+").replace(/\./g,"/");while(s.length%4)s+="=";const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function makeCode(st){
  const ans=Q.map(q=>st.answers[q.id]==null?"-":"abcd"[st.answers[q.id]]).join("");
  const used=Math.round(Math.min(DURATION_MIN*60,(st.submittedAt-st.startedAt)/1000));
  const payload=[st.name,ans,used,st.leaves,st.submittedAt,st.auto?1:0].join("|");
  return TEST_ID+"-"+b64e(payload)+"-"+hash(SALT+payload);
}
function parseCode(code){
  const m=/^SQL2-([A-Za-z0-9_.]+)-([0-9a-z]{6})$/.exec(code.trim());
  if(!m)return null;
  let payload;try{payload=b64d(m[1])}catch(e){return null}
  const parts=payload.split("|");if(parts.length<6)return null;
  const [name,ans,used,leaves,at,auto]=parts;
  const answers={};Q.forEach((q,i)=>{const c=ans[i];answers[q.id]=(c&&c!=="-")?"abcd".indexOf(c):null});
  return {name,answers,used:+used,leaves:+leaves,at:+at,auto:auto==="1",valid:hash(SALT+payload)===m[2],code:code.trim()};
}
function scoreOf(answers){return Q.reduce((n,q)=>n+(answers[q.id]===KEY[q.id]?1:0),0)}

/* ---------- State ---------- */
let S = load() || {phase:"start"};
let timerId=null;
const app=$("#app");

function render(){
  clearInterval(timerId);
  if(location.hash==="#grader"){renderGrader();return}
  if(S.phase==="exam")renderExam();
  else if(S.phase==="done")renderDone();
  else renderStart();
}

/* ---------- Start ---------- */
function renderStart(){
  app.innerHTML=`
  <div class="wrap stack">
    <div class="eyebrow">Data Engineering Fundamentals · Module 2 · Technical screening</div>
    <div class="start">
      <div class="card stack">
        <h1>SQL Screening Test</h1>
        <p class="muted" style="margin:0;max-width:60ch">This test works like the online SQL assessment in a real data engineering hiring process. Every question uses the Olist tables you queried in Week 2.</p>
        <div class="facts">
          <div class="fact"><b>${Q.length}</b><span class="muted">questions</span></div>
          <div class="fact"><b>${DURATION_MIN}</b><span class="muted">minutes</span></div>
          <div class="fact"><b>1</b><span class="muted">attempt</span></div>
        </div>
        <div class="topics">${[...new Set(Q.map(q=>q.topic))].map(t=>`<span class="chip">${t}</span>`).join("")}</div>
      </div>
      <div class="card stack">
        <h2>Before you start</h2>
        <ol class="rules">
          <li>Keep your camera on in Zoom for the whole test.</li>
          <li>No notes, slides, psql or AI tools. Think it through like an interview.</li>
          <li>Stay on this tab. Leaving the tab is recorded.</li>
          <li>The timer can't be paused. At 00:00 your answers are submitted automatically.</li>
          <li>When you finish, copy your result code into the Zoom chat.</li>
        </ol>
        <label for="cand" class="eyebrow">Your full name</label>
        <input type="text" id="cand" autocomplete="name" placeholder="e.g. Aung Min Thu" maxlength="60">
        <button class="primary" id="go" disabled>Start the test</button>
      </div>
    </div>
  </div>`;
  const inp=$("#cand"),go=$("#go");
  inp.addEventListener("input",()=>go.disabled=inp.value.trim().length<2);
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!go.disabled)go.click()});
  go.addEventListener("click",()=>{
    S={phase:"exam",name:inp.value.trim().replace(/\|/g," "),order:shuffle(Q.map(q=>q.id)),cur:0,answers:{},flags:{},leaves:0,startedAt:Date.now()};
    save();
    try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}
    render();
  });
}

/* ---------- Exam ---------- */
function remaining(){return DURATION_MIN*60-(Date.now()-S.startedAt)/1000}
function renderExam(){
  if(remaining()<=0){submit(true);return}
  const qid=S.order[S.cur], q=Q.find(x=>x.id===qid);
  const answered=Object.values(S.answers).filter(v=>v!=null).length;
  app.innerHTML=`
  <div class="bar"><div class="inner">
    <div><div class="eyebrow">Candidate</div><div class="who">${esc(S.name)}</div></div>
    <div class="row"><span class="muted" style="font-variant-numeric:tabular-nums">${answered}/${Q.length} answered</span><div class="timer" id="timer" role="timer" aria-live="off">${fmt(remaining())}</div></div>
  </div><div class="progress"><span style="width:${answered/Q.length*100}%"></span></div></div>
  <div class="wrap">
    ${S.leaves?`<div class="notice" style="margin-bottom:16px">You left this tab ${S.leaves} time${S.leaves>1?"s":""}. This is included in your result.</div>`:""}
    <div class="exam">
      <div class="card stack">
        <div class="qhead"><span class="eyebrow">Question ${S.cur+1} of ${Q.length} · ${q.topic}</span>
          <button class="ghost flagbtn ${S.flags[qid]?"on":""}" id="flag" aria-pressed="${!!S.flags[qid]}">${S.flags[qid]?"Flagged":"Flag for review"}</button></div>
        <div class="qtext">${q.text}</div>
        ${q.code?`<pre>${esc(q.code)}</pre>`:""}
        <div class="opts" role="radiogroup" aria-label="Answer options">
          ${q.opts.map((o,i)=>`<label class="opt ${S.answers[qid]===i?"sel":""}">
            <input type="radio" name="q${qid}" id="q${qid}o${i}" value="${i}" ${S.answers[qid]===i?"checked":""}>
            <span class="key">${L[i]}</span>
            <span class="body">${typeof o==="string"?esc(o):`<pre>${esc(o.code)}</pre>`}</span></label>`).join("")}
        </div>
        <div class="row" style="justify-content:space-between">
          <button id="prev" ${S.cur===0?"disabled":""}>Previous</button>
          ${S.cur<Q.length-1?`<button class="primary" id="next">Next</button>`:`<button class="primary" id="finish">Review &amp; submit</button>`}
        </div>
      </div>
      <aside class="card stack nav" aria-label="Question navigator">
        <span class="eyebrow">Questions</span>
        <div class="grid">${S.order.map((id,i)=>`<button data-i="${i}" class="${S.answers[id]!=null?"done":""} ${i===S.cur?"cur":""} ${S.flags[id]?"flag":""}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
        <div class="legend"><span><i class="sw" style="background:var(--accent-soft);border-color:var(--accent)"></i>Answered</span><span><i class="sw" style="box-shadow:inset 0 -3px 0 var(--flag)"></i>Flagged</span></div>
        <button id="finish2">Submit test</button>
      </aside>
    </div>
  </div>`;
  app.querySelectorAll(".opt input").forEach(r=>r.addEventListener("change",()=>{S.answers[qid]=+r.value;save();renderExam()}));
  $("#flag").onclick=()=>{S.flags[qid]=!S.flags[qid];save();renderExam()};
  $("#prev").onclick=()=>{S.cur--;save();renderExam()};
  const n=$("#next");if(n)n.onclick=()=>{S.cur++;save();renderExam()};
  const f=$("#finish");if(f)f.onclick=confirmSubmit;
  $("#finish2").onclick=confirmSubmit;
  app.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{S.cur=+b.dataset.i;save();renderExam()});
  tick();timerId=setInterval(tick,1000);
}
function tick(){
  const r=remaining(),t=$("#timer");
  if(r<=0){submit(true);return}
  if(t){t.textContent=fmt(r);t.className="timer"+(r<=60?" crit":r<=300?" low":"")}
}
function confirmSubmit(){
  const blank=Q.length-Object.values(S.answers).filter(v=>v!=null).length;
  const flagged=Object.values(S.flags).filter(Boolean).length;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card stack" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">Submit your test?</h2>
    <p style="margin:0">${blank?`<b>${blank}</b> question${blank>1?"s are":" is"} unanswered. `:"All questions are answered. "}${flagged?`${flagged} flagged for review. `:""}You can't change answers after submitting.</p>
    <div class="row" style="justify-content:flex-end"><button id="mc">Keep working</button><button class="primary" id="ms">Submit</button></div></div>`;
  document.body.appendChild(m);
  $("#mc",m).onclick=()=>m.remove();
  $("#ms",m).onclick=()=>{m.remove();submit(false)};
  $("#ms",m).focus();
}
function submit(auto){
  if(S.phase!=="exam")return;
  clearInterval(timerId);
  S.phase="done";S.auto=auto;S.submittedAt=Math.min(Date.now(),S.startedAt+DURATION_MIN*60000);
  S.code=makeCode(S);save();
  try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
  render();
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&S.phase==="exam"){S.leaves=(S.leaves||0)+1;save()}
  else if(!document.hidden&&S.phase==="exam")renderExam();
});

/* ---------- Done ---------- */
function renderDone(){
  const sc=scoreOf(S.answers);
  app.innerHTML=`
  <div class="wrap stack" style="max-width:640px">
    <div class="eyebrow">Test submitted${S.auto?" · time ran out":""}</div>
    <div class="card stack">
      <h1>Thank you, ${esc(S.name)}</h1>
      <div class="row" style="align-items:flex-end;gap:20px">
        <div><div class="score">${sc}<span class="muted" style="font-size:1.4rem">/${Q.length}</span></div><span class="muted">your score</span></div>
        <div class="muted">Time used ${fmt((S.submittedAt-S.startedAt)/1000)}</div>
      </div>
      <p style="margin:0">Copy your result code and paste it into the <b>Zoom chat</b>. Your instructor will go through the answers with everyone after the test.</p>
      <div class="codebox" id="code">${esc(S.code)}</div>
      <div class="row"><button class="primary" id="copy">Copy result code</button><span class="muted" id="copied" aria-live="polite"></span></div>
    </div>
  </div>`;
  $("#copy").onclick=()=>{
    const done=()=>$("#copied").textContent="Copied. Paste it into the Zoom chat.";
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($("#code"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("#copied").textContent="Selected. Press Ctrl+C (or ⌘C) to copy."};
    try{navigator.clipboard.writeText(S.code).then(done,fallback)}catch(e){fallback()}
  };
}

/* ---------- Grader (instructor) ---------- */
let G={text:"",tab:"results",sort:"score"};
function renderGrader(){
  const found=[...new Set((G.text.match(/SQL2-[A-Za-z0-9_.]+-[0-9a-z]{6}/g)||[]))].map(parseCode).filter(Boolean);
  // keep the latest submission per name
  const byName={};found.forEach(r=>{const k=r.name.toLowerCase();if(!byName[k]||r.at>byName[k].at)byName[k]=r});
  let rows=Object.values(byName).map(r=>({...r,score:scoreOf(r.answers)}));
  rows.sort(G.sort==="name"?(a,b)=>a.name.localeCompare(b.name):G.sort==="time"?(a,b)=>a.used-b.used:(a,b)=>b.score-a.score||a.used-b.used);
  const avg=rows.length?rows.reduce((n,r)=>n+r.score,0)/rows.length:0;
  const qstats=Q.map(q=>({q,pct:rows.length?rows.filter(r=>r.answers[q.id]===KEY[q.id]).length/rows.length:0}));
  const band=s=>s/Q.length>=.8?"g":s/Q.length>=.6?"w":"b";
  app.innerHTML=`
  <div class="wrap stack">
    <div class="row" style="justify-content:space-between">
      <div><div class="eyebrow">Instructor view</div><h1>SQL Screening Results</h1></div>
      <a href="#" id="back" class="muted">Back to test page</a>
    </div>
    <div class="card stack">
      <label for="paste" class="eyebrow">Paste the Zoom chat (or any text containing result codes)</label>
      <textarea id="paste" placeholder="Copy the whole Zoom chat and paste it here. Codes look like SQL2-QXVuZy...-a1b2c3">${esc(G.text)}</textarea>
      <div class="row muted"><span><b style="color:var(--fg)">${rows.length}</b> candidate${rows.length===1?"":"s"}</span>${rows.length?`<span>Average <b style="color:var(--fg)">${avg.toFixed(1)}/${Q.length}</b></span><span>Pass mark 12/${Q.length} (80%): <b style="color:var(--fg)">${rows.filter(r=>r.score>=12).length}</b> passed</span>`:""}</div>
    </div>
    <div class="tabs" role="tablist">
      ${[["results","Candidates"],["questions","By question"],["key","Answer key"]].map(([k,t])=>`<button role="tab" aria-selected="${G.tab===k}" data-tab="${k}">${t}</button>`).join("")}
    </div>
    <div id="pane"></div>
  </div>`;
  const pane=$("#pane");
  if(G.tab==="results"){
    pane.innerHTML=rows.length?`<div class="tablewrap"><table>
      <thead><tr><th data-s="name">Candidate</th><th data-s="score" class="c">Score</th><th data-s="time" class="c">Time</th><th class="c">Tab left</th>${Q.map(q=>`<th class="c" title="${esc(q.topic)}">Q${q.id}</th>`).join("")}<th>Check</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${esc(r.name)}</td>
        <td class="c"><span class="pill ${band(r.score)}">${r.score}/${Q.length}</span></td>
        <td class="c">${fmt(r.used)}${r.auto?" ⏱":""}</td>
        <td class="c">${r.leaves?`<span class="pill w">${r.leaves}×</span>`:"0"}</td>
        ${Q.map(q=>{const a=r.answers[q.id];return a==null?`<td class="c na">–</td>`:a===KEY[q.id]?`<td class="c ok">✓</td>`:`<td class="c no">${L[a]}</td>`}).join("")}
        <td>${r.valid?`<span class="muted">OK</span>`:`<span class="pill b">Edited code</span>`}</td></tr>`).join("")}</tbody></table></div>
      <p class="muted" style="margin:8px 0 0;font-size:.85rem">Question numbers match the answer key, not each student's shuffled order. A red letter is the wrong option the student chose. ⏱ means time ran out.</p>`
      :`<div class="card muted">No result codes yet. Paste the Zoom chat above when students have submitted.</div>`;
    pane.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{G.sort=th.dataset.s;renderGrader()});
  }else if(G.tab==="questions"){
    pane.innerHTML=`<div class="card">${qstats.map(({q,pct})=>`<div class="qstat"><b>Q${q.id}</b><span style="min-width:0">${q.topic}<span class="muted"> · ${q.text.replace(/<[^>]+>/g,"").slice(0,70)}…</span></span><div class="meter ${pct<.5?"lo":""}"><span style="width:${pct*100}%"></span></div><span style="text-align:right">${rows.length?Math.round(pct*100)+"%":"–"}</span></div>`).join("")}
    <p class="muted" style="margin:10px 0 0;font-size:.85rem">Questions under 50% (shown in red) are the ones to go through first in the debrief.</p></div>`;
  }else{
    pane.innerHTML=`<div class="card">${Q.map(q=>`<details class="key"><summary>Q${q.id} · ${q.topic} · Answer ${L[KEY[q.id]]}</summary>
      <div class="stack" style="margin-top:10px"><div class="qtext">${q.text}</div>${q.code?`<pre>${esc(q.code)}</pre>`:""}
      <div class="opts">${q.opts.map((o,i)=>`<div class="opt ${i===KEY[q.id]?"sel":""}" style="cursor:default"><span class="key">${L[i]}</span><span class="body">${typeof o==="string"?esc(o):`<pre>${esc(o.code)}</pre>`}</span></div>`).join("")}</div>
      <div class="explain">${q.why}</div></div></details>`).join("")}</div>`;
  }
  $("#paste").addEventListener("input",e=>{G.text=e.target.value;const pos=e.target.selectionStart;renderGrader();const t=$("#paste");t.focus();t.setSelectionRange(pos,pos)});
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{G.tab=b.dataset.tab;renderGrader()});
  $("#back").onclick=e=>{e.preventDefault();history.replaceState(null,"",location.pathname+location.search);render()};
}
window.addEventListener("hashchange",render);

/* Instructor tools for the owner */
(async()=>{
  try{
    const u=window.claude&&await window.claude.use("user");
    if(u&&u.isOwner&&await u.isOwner()&&location.hash!=="#grader"&&S.phase!=="exam"){
      const a=document.createElement("a");a.href="#grader";a.textContent="Open instructor results";
      a.style.cssText="position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-weight:600;text-decoration:none;z-index:9";
      document.body.appendChild(a);
      window.addEventListener("hashchange",()=>a.hidden=location.hash==="#grader"||S.phase==="exam");
    }
  }catch(e){}
})();

render();
})();
</script>

</body>
</html>
